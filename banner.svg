<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes pulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.4)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.8)); }
    }
    @keyframes pulse-purple {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(168, 85, 247, 0.4)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.8)); }
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -40;
      }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Classes for Elements */
    .bg { fill: url(#bg-grad); }
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: url(#text-grad);
      opacity: 0;
      animation: fadeInUp 1s ease-out forwards;
    }
    .subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #94a3b8;
      opacity: 0;
      animation: fadeInUp 1s ease-out 0.4s forwards;
    }
    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 11px;
      fill: #e2e8f0;
    }
    .badge-group {
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.8s forwards;
    }
    .node-blue {
      animation: pulse 4s infinite ease-in-out;
      transform-origin: 100px 110px;
    }
    .node-purple {
      animation: pulse-purple 4s infinite ease-in-out 2s;
      transform-origin: 100px 50px;
    }
    .node-pink {
      animation: pulse 4s infinite ease-in-out 1s;
      transform-origin: 180px 110px;
    }
    .connector {
      stroke: #475569;
      stroke-width: 2;
      stroke-dasharray: 6, 4;
      animation: dash 2.5s linear infinite;
    }
  </style>

  <!-- Background Rect -->
  <rect width="800" height="220" rx="12" class="bg" />

  <!-- Animated UML/Graph Illustration on the Left -->
  <g transform="translate(40, 0)">
    <!-- Connector Lines -->
    <line x1="100" y1="50" x2="100" y2="110" class="connector" />
    <line x1="100" y1="110" x2="180" y2="110" class="connector" />
    <line x1="100" y1="50" x2="180" y2="110" class="connector" />

    <!-- Node 1 (Purple - Top) -->
    <g class="node-purple">
      <circle cx="100" cy="50" r="16" fill="#a855f7" opacity="0.8" />
      <circle cx="100" cy="50" r="10" fill="#c084fc" />
    </g>

    <!-- Node 2 (Blue - Left-Bottom) -->
    <g class="node-blue">
      <circle cx="100" cy="110" r="20" fill="#0284c7" opacity="0.8" />
      <circle cx="100" cy="110" r="13" fill="#38bdf8" />
    </g>

    <!-- Node 3 (Pink/Blue - Right-Bottom) -->
    <g class="node-pink">
      <rect x="162" y="92" width="36" height="36" rx="6" fill="#ec4899" opacity="0.8" />
      <rect x="167" y="97" width="26" height="26" rx="4" fill="#f472b6" />
    </g>
    
    <!-- User/Actor Icon inside Node 2 -->
    <path d="M100 102 A3 3 0 1 0 100 108 A3 3 0 1 0 100 102 Z M94 116 A6 6 0 0 1 106 116" stroke="#ffffff" stroke-width="2" fill="none" />
    
    <!-- Class Icon/Text inside Node 3 -->
    <text x="172" y="114" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">C</text>
  </g>

  <!-- Title & Text content -->
  <text x="280" y="85" class="title">Requirements App</text>
  <text x="280" y="115" class="subtitle">Define Use Cases • Manage CRC Cards • Export UML Diagrams</text>

  <!-- Animated Badges -->
  <!-- Spring Boot -->
  <g transform="translate(280, 145)">
    <g class="badge-group">
      <rect width="95" height="24" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="1" />
      <text x="47.5" y="16" class="badge-text" text-anchor="middle">Spring Boot 3</text>
    </g>
  </g>
  
  <!-- Java 17 -->
  <g transform="translate(390, 145)">
    <g class="badge-group">
      <rect width="70" height="24" rx="12" fill="#1e293b" stroke="#e11d48" stroke-width="1" />
      <text x="35" y="16" class="badge-text" text-anchor="middle">Java 17</text>
    </g>
  </g>

  <!-- Thymeleaf -->
  <g transform="translate(475, 145)">
    <g class="badge-group">
      <rect width="90" height="24" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="1" />
      <text x="45" y="16" class="badge-text" text-anchor="middle">Thymeleaf</text>
    </g>
  </g>

  <!-- H2 DB -->
  <g transform="translate(580, 145)">
    <g class="badge-group">
      <rect width="70" height="24" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <text x="35" y="16" class="badge-text" text-anchor="middle">H2 DB</text>
    </g>
  </g>
</svg>
