<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>My Projects</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row mt-4">
        <div class="col-md-8">
            <h2>My Projects</h2>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${projects.empty}" class="alert alert-info">
                You don't have any projects yet!
            </div>
            <div class="list-group">
                <div th:each="project : ${projects}" class="list-group-item list-group-item-action flex-column align-items-start mb-2 shadow-sm rounded">
                    <div class="d-flex w-100 justify-content-between">
                        <h5 class="mb-1">
                            <span th:text="${project.name}">Project Name</span>
                            <span th:if="${project.user.username != #authentication.name}" class="badge bg-info ms-2">Shared by <span th:text="${project.user.username}"></span></span>
                        </h5>
                        <div class="d-flex gap-2">
                            <a th:href="@{/projects/{id}/usecases(id=${project.id})}" class="btn btn-sm btn-outline-primary">Use Cases</a>
                            <a th:href="@{/projects/{id}/crccards(id=${project.id})}" class="btn btn-sm btn-outline-success">CRC Cards</a>
                            <a th:href="@{/projects/{id}/generate(id=${project.id})}" class="btn btn-sm btn-outline-dark">Generate Diagrams</a>
                            <form th:if="${project.user.username == #authentication.name}" th:action="@{/projects/delete/{id}(id=${project.id})}" method="post" onsubmit="return confirm('Are you sure you want to delete this project?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                            </form>
                        </div>
                    </div>
                    <p class="mb-1 text-muted" th:text="${project.description}">Project Description</p>
                    <div th:if="${project.user.username == #authentication.name}" class="mt-3 border-top pt-2">
                        <form th:action="@{/projects/{id}/teammates(id=${project.id})}" method="post" class="d-flex align-items-center gap-2">
                            <label class="form-label mb-0 small text-muted">Add Teammate:</label>
                            <input type="text" name="username" class="form-control form-control-sm w-auto" placeholder="Username" required>
                            <button type="submit" class="btn btn-sm btn-outline-secondary">Add</button>
                        </form>
                        <div th:if="${!project.teammates.empty}" class="mt-1 small text-muted">
                            Shared with: <span th:each="t, iterStat : ${project.teammates}"><span th:text="${t.username}"></span><span th:if="${!iterStat.last}">, </span></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="card-title mb-0">Create New Project</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/projects/create}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label">Project Name</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Create</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
