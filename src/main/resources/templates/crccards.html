<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>CRC Cards</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row mt-4">
        <div class="col-md-12">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2>CRC Cards for Project: <span th:text="${project.name}" class="text-success"></span></h2>
                <a th:href="@{/projects/{id}/crccards/new(id=${project.id})}" class="btn btn-success">Add New CRC Card</a>
            </div>
            
            <div th:if="${crcCards.empty}" class="alert alert-info">
                No CRC cards defined for this project yet.
            </div>
            
            <div class="row row-cols-1 row-cols-md-2 g-4">
                <div th:each="crcCard : ${crcCards}" class="col">
                    <div class="card h-100 shadow-sm border-success">
                        <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                            <h5 class="card-title mb-0" th:text="${crcCard.className}">Class Name</h5>
                            <div>
                                <a th:href="@{/projects/{pid}/crccards/edit/{cid}(pid=${project.id}, cid=${crcCard.id})}" class="btn btn-sm btn-light text-success">Edit</a>
                                <form th:action="@{/projects/{pid}/crccards/delete/{cid}(pid=${project.id}, cid=${crcCard.id})}" method="post" class="d-inline" onsubmit="return confirm('Delete this CRC Card?');">
                                    <button type="submit" class="btn btn-sm btn-danger border-light">Delete</button>
                                </form>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-sm-6 border-end">
                                    <h6 class="text-muted border-bottom pb-2">Responsibilities</h6>
                                    <p class="mb-0" style="white-space: pre-wrap;" th:text="${crcCard.responsibilities}"></p>
                                </div>
                                <div class="col-sm-6">
                                    <h6 class="text-muted border-bottom pb-2">Collaborations</h6>
                                    <p class="mb-0" style="white-space: pre-wrap;" th:text="${crcCard.collaborations}"></p>
                                </div>
                            </div>
                            
                            <div class="mt-3 border-top pt-2">
                                <h6>Comments</h6>
                                <div th:each="comment : ${crcCard.comments}" class="mb-2 p-2 bg-light rounded small border border-success border-opacity-25">
                                    <strong th:text="${comment.author.username}"></strong>: 
                                    <span th:text="${comment.text}"></span>
                                </div>
                                <form th:action="@{/projects/{pid}/crccards/{cid}/comments(pid=${project.id}, cid=${crcCard.id})}" method="post" class="mt-2">
                                    <div class="input-group input-group-sm">
                                        <input type="text" name="text" class="form-control" placeholder="Add a comment..." required>
                                        <button class="btn btn-outline-success" type="submit">Post</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="mt-4">
                <a th:href="@{/projects}" class="btn btn-secondary">&laquo; Back to Projects</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
