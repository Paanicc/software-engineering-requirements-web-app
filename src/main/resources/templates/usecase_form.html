<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Use Case Form</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center mt-4">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h3 class="card-title mb-0" th:text="${useCase.id == null ? 'Create New Use Case' : 'Edit Use Case'}"></h3>
                </div>
                <div class="card-body">
                    <form th:action="${useCase.id == null} ? @{/projects/{pid}/usecases/new(pid=${project.id})} : @{/projects/{pid}/usecases/edit/{uid}(pid=${project.id}, uid=${useCase.id})}" method="post" th:object="${useCase}">
                        
                        <div class="mb-3">
                            <label for="title" class="form-label fw-bold">Title</label>
                            <input type="text" id="title" th:field="*{title}" class="form-control" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="actorNames" class="form-label fw-bold">Actors (comma-separated)</label>
                            <input type="text" id="actorNames" name="actorNames" th:value="${actorNames}" class="form-control" placeholder="e.g. Developer, Admin, User">
                        </div>
                        
                        <div class="mb-3 border p-3 rounded bg-light" th:if="${!availableCrcCards.empty}">
                            <label class="form-label fw-bold">Link CRC Cards</label>
                            <div class="row">
                                <div class="col-md-4" th:each="crc : ${availableCrcCards}">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="crcCardIds" 
                                               th:value="${crc.id}" th:id="'crc_' + ${crc.id}"
                                               th:checked="${useCase.crcCards != null and useCase.crcCards.contains(crc)}">
                                        <label class="form-check-label" th:for="'crc_' + ${crc.id}" th:text="${crc.className}">
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="preconditions" class="form-label fw-bold">Preconditions</label>
                            <textarea id="preconditions" th:field="*{preconditions}" class="form-control" rows="3"></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label for="mainFlow" class="form-label fw-bold">Main Flow</label>
                            <textarea id="mainFlow" th:field="*{mainFlow}" class="form-control" rows="5"></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label for="postconditions" class="form-label fw-bold">Postconditions</label>
                            <textarea id="postconditions" th:field="*{postconditions}" class="form-control" rows="3"></textarea>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/projects/{pid}/usecases(pid=${project.id})}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary" th:text="${useCase.id == null ? 'Create Use Case' : 'Save Changes'}"></button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
