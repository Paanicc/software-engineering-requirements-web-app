<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Use Cases</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row mt-4">
        <div class="col-md-12">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2>Use Cases for Project: <span th:text="${project.name}" class="text-primary"></span></h2>
                <a th:href="@{/projects/{id}/usecases/new(id=${project.id})}" class="btn btn-success">Add New Use Case</a>
            </div>
            
            <div th:if="${useCases.empty}" class="alert alert-info">
                No use cases defined for this project yet.
            </div>
            
            <div class="row row-cols-1 row-cols-md-2 g-4">
                <div th:each="useCase : ${useCases}" class="col">
                    <div class="card h-100 shadow-sm">
                        <div class="card-header bg-light d-flex justify-content-between align-items-center">
                            <h5 class="card-title mb-0" th:text="${useCase.title}">Use Case Title</h5>
                            <div>
                                <a th:href="@{/projects/{pid}/usecases/edit/{uid}(pid=${project.id}, uid=${useCase.id})}" class="btn btn-sm btn-outline-secondary">Edit</a>
                                <form th:action="@{/projects/{pid}/usecases/delete/{uid}(pid=${project.id}, uid=${useCase.id})}" method="post" class="d-inline" onsubmit="return confirm('Delete this Use Case?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                                </form>
                            </div>
                        </div>
                        <div class="card-body">
                            <p><strong>Actors:</strong> 
                                <span th:each="actor, iterStat : ${useCase.actors}">
                                    <span th:text="${actor.name}" class="badge bg-secondary"></span>
                                </span>
                                <span th:if="${useCase.actors.empty}" class="text-muted fst-italic">None</span>
                            </p>
                            <p><strong>Linked CRC Cards:</strong> 
                                <span th:each="crc, iterStat : ${useCase.crcCards}">
                                    <span th:text="${crc.className}" class="badge bg-success"></span>
                                </span>
                                <span th:if="${useCase.crcCards.empty}" class="text-muted fst-italic">None</span>
                            </p>
                            <p><strong>Preconditions:</strong> <br/><span th:text="${useCase.preconditions}"></span></p>
                            <p><strong>Main Flow:</strong> <br/><span th:text="${useCase.mainFlow}"></span></p>
                            <p><strong>Postconditions:</strong> <br/><span th:text="${useCase.postconditions}"></span></p>
                            
                            <div class="mt-3 border-top pt-2">
                                <h6>Comments</h6>
                                <div th:each="comment : ${useCase.comments}" class="mb-2 p-2 bg-light rounded small border">
                                    <strong th:text="${comment.author.username}"></strong>: 
                                    <span th:text="${comment.text}"></span>
                                </div>
                                <form th:action="@{/projects/{pid}/usecases/{uid}/comments(pid=${project.id}, uid=${useCase.id})}" method="post" class="mt-2">
                                    <div class="input-group input-group-sm">
                                        <input type="text" name="text" class="form-control" placeholder="Add a comment..." required>
                                        <button class="btn btn-outline-primary" type="submit">Post</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="mt-4">
                <a th:href="@{/projects}" class="btn btn-secondary">&laquo; Back to Projects</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
