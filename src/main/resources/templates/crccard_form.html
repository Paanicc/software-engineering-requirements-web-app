<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>CRC Card Form</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center mt-4">
        <div class="col-md-8">
            <div class="card shadow-sm border-success">
                <div class="card-header bg-success text-white">
                    <h3 class="card-title mb-0" th:text="${crcCard.id == null ? 'Create New CRC Card' : 'Edit CRC Card'}"></h3>
                </div>
                <div class="card-body">
                    <form th:action="${crcCard.id == null} ? @{/projects/{pid}/crccards/new(pid=${project.id})} : @{/projects/{pid}/crccards/edit/{cid}(pid=${project.id}, cid=${crcCard.id})}" method="post" th:object="${crcCard}">
                        
                        <div class="mb-3">
                            <label for="className" class="form-label fw-bold">Class Name</label>
                            <input type="text" id="className" th:field="*{className}" class="form-control" required>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="responsibilities" class="form-label fw-bold">Responsibilities</label>
                                <textarea id="responsibilities" th:field="*{responsibilities}" class="form-control" rows="8" ></textarea>
                            </div>
                            <div class="col-md-6">
                                <label for="collaborations" class="form-label fw-bold">Collaborations</label>
                                <textarea id="collaborations" th:field="*{collaborations}" class="form-control" rows="8"></textarea>
                            </div>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/projects/{pid}/crccards(pid=${project.id})}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-success" th:text="${crcCard.id == null ? 'Create CRC Card' : 'Save Changes'}"></button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
